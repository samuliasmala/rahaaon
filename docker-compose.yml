services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: rahaaon
      POSTGRES_PASSWORD: rahaaon
      POSTGRES_DB: rahaaon
    ports:
      # 5432/5433 are often taken (host Postgres, vesi dev); map to 5434.
      - "127.0.0.1:5434:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rahaaon -d rahaaon"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3 (versitygw) for the article archive (see api/src/lib/article-archive.ts).
  # Dev-only credentials, matching .env.example. --region auto: the app signs
  # for "auto" (R2's convention) and versitygw rejects any region but its own.
  # The bucket is a directory the container creates at start (POSIX backend).
  s3:
    image: versity/versitygw:v1.10.0
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command: ['mkdir -p /data/rahaaon && exec /usr/local/bin/versitygw --port :9000 --region auto --health /health posix /data']
    environment:
      ROOT_ACCESS_KEY_ID: rahaaon
      ROOT_SECRET_ACCESS_KEY: rahaaon-dev-secret
    ports:
      # 9000 is often taken by other local S3 servers; map to 9002.
      - "127.0.0.1:9002:9000"
    volumes:
      - s3_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
  s3_data:
