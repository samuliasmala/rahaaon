services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: rahaaon
      POSTGRES_PASSWORD: rahaaon
      POSTGRES_DB: rahaaon
    ports:
      # 5432/5433 are often taken (host Postgres, vesi dev); map to 5434.
      - "127.0.0.1:5434:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rahaaon -d rahaaon"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3 for the article archive (see api/src/lib/article-archive.ts). Dev-only
  # credentials, matching .env.example. Console: http://localhost:9003
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: rahaaon
      MINIO_ROOT_PASSWORD: rahaaon-dev-minio
    ports:
      # 9000/9001 are often taken by other local MinIOs; map to 9002/9003.
      - "127.0.0.1:9002:9000"
      - "127.0.0.1:9003:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: create the bucket the archive expects, then exit. Safe to re-run
  # (--ignore-existing); plain `up -d` tolerates the exited container.
  minio-init:
    image: minio/mc:latest
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set local http://minio:9000 rahaaon rahaaon-dev-minio
        mc mb --ignore-existing local/rahaaon
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy

volumes:
  db_data:
  minio_data:
