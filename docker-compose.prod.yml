# Deployable stack — pulled images (built & pushed by CI to GHCR) + bundled
# Postgres. Self-contained; does NOT layer on docker-compose.yml.
#
# One file, three environments. They are isolated by Compose *project name*, so
# containers/networks/volumes never collide (rahaaon-dev_db_data,
# rahaaon-test_db_data, rahaaon-prod_db_data …). Pick the env with -p + the
# matching env file:
#
#   export DEPLOY_ENV=prod            # dev | test | prod  (selects .env.$DEPLOY_ENV)
#   docker compose -p rahaaon-$DEPLOY_ENV --env-file .env.$DEPLOY_ENV \
#     -f docker-compose.prod.yml up -d
#
# IMAGE_TAG/REGISTRY are supplied by the deploy shell (deploy/deploy.sh); they
# default so a local `docker compose ... build` still tags sensibly. nginx (web)
# serves the SPA and proxies /api -> api; only web is published (to localhost),
# with host Caddy terminating TLS in front. See DEPLOYMENT.md.

# Cap container logs (unbounded json-file logs on a shared VPS can fill the disk
# and take down every stack on it). Applied to every long-running service via
# the YAML anchor below.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:17
    restart: unless-stopped
    # Explicit vars, NOT env_file: the full .env.* would hand the db container
    # every app secret (AUTH_SECRET, …), readable via `docker inspect`. Empty
    # password default (rather than :?) keeps a bare local `… build` parseable;
    # the postgres image refuses to start without a password anyway.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rahaaon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-rahaaon}
    logging: *default-logging
    mem_limit: 1g
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-rahaaon} -d $${POSTGRES_DB:-rahaaon}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Self-hosted S3-compatible object storage (versitygw) for the dev/test stacks
  # (DB backups). profile-gated ["s3"]: prod NEVER starts it — prod
  # points S3_* at Cloudflare R2. deploy/deploy.sh activates --profile s3 for
  # dev/test. The gateway's root account doubles as the S3 access key (reused by
  # backup.sh), so all agree on ${S3_*}. --region auto: the clients
  # sign for "auto" (R2's convention) and versitygw rejects any region but its
  # own. The POSIX backend treats top-level directories as buckets, so the
  # bucket is created with mkdir at start — no CreateBucket call, which the
  # "auto" region would reject as an illegal location constraint. Empty (`:-`)
  # defaults — not `:?` — because interpolation runs before profile filtering,
  # so a `:?` here would break every prod command; the values only matter when
  # the profile is on.
  s3:
    image: versity/versitygw:v1.10.0
    profiles: ["s3"]
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command: ['mkdir -p "/data/${S3_BUCKET:-rahaaon}" && exec /usr/local/bin/versitygw --port :9000 --region auto --health /health posix /data']
    environment:
      ROOT_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      ROOT_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    logging: *default-logging
    mem_limit: 256m
    expose:
      - "9000" # S3 API — internal to the stack network (backup uses s3:9000)
    volumes:
      - s3_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # One-shot: apply pending migrations, then exit. The api waits for it. Reuses
  # the api image (migrate.js is bundled into it) — no separate build/push.
  migrate:
    image: ${REGISTRY:-ghcr.io/samuliasmala}/rahaaon-api:${IMAGE_TAG:-latest}
    command: ["node", "dist/db/migrate.js"]
    env_file: [".env.${DEPLOY_ENV:-prod}"]
    logging: *default-logging
    mem_limit: 512m
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    image: ${REGISTRY:-ghcr.io/samuliasmala}/rahaaon-api:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    env_file: [".env.${DEPLOY_ENV:-prod}"]
    logging: *default-logging
    mem_limit: 512m
    # Give the graceful shutdown (drain HTTP → close the pool; the server
    # force-exits after 10s) room to finish before SIGKILL.
    stop_grace_period: 15s
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - "3001"
    healthcheck:
      # Readiness (checks the DB), so --wait/compose only consider the API up once
      # it can actually serve — not merely process-alive.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    image: ${REGISTRY:-ghcr.io/samuliasmala}/rahaaon-web:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        # Version footer; for a local build:
        #   GIT_COMMIT=$(git rev-parse HEAD) GIT_DESCRIBE=$(git describe --tags --always) GIT_COMMIT_TIME=$(git log -1 --format=%cI) docker compose … build web
        GIT_COMMIT: ${GIT_COMMIT:-}
        GIT_DESCRIBE: ${GIT_DESCRIBE:-}
        GIT_COMMIT_TIME: ${GIT_COMMIT_TIME:-}
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 128m
    depends_on:
      - api
    ports:
      # Bound to localhost — host Caddy proxies the public domain to this port.
      # Deliberately NO default: a silently-missing WEB_PORT would grab another
      # stack's port (and Caddy would route the wrong env). Each .env.* must set
      # it; prefix WEB_PORT=8090 for a local `… config/build`.
      - "127.0.0.1:${WEB_PORT:?set WEB_PORT in the env file (prod 8090 / dev 8091 / test 8092)}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # On-demand backup runner (profile-gated: never starts with `up`). Invoked by
  # deploy/deploy.sh and the systemd timer:
  #   docker compose --profile backup run --rm backup [label]
  # Backup image is decoupled from the app IMAGE_TAG: it's infra (pg_dump tied to
  # the Postgres major, not the app), so CI keeps a moving :stable tag. This lets
  # the daily timer / on-demand runs work without knowing the deployed app tag.
  backup:
    image: ${REGISTRY:-ghcr.io/samuliasmala}/rahaaon-backup:${BACKUP_IMAGE_TAG:-stable}
    build:
      context: .
      dockerfile: docker/backup.Dockerfile
    profiles: ["backup"]
    env_file: [".env.${DEPLOY_ENV:-prod}"] # DATABASE_URL, S3_*, BACKUP_ENV, RETENTION_DAYS
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  s3_data:
