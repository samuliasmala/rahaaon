server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS, re-consulted per request via the variable
    # proxy_pass below — a recreated api container (new IP) doesn't leave nginx
    # serving 502s from an address cached at startup.
    resolver 127.0.0.11 valid=10s;

    client_max_body_size 5m;

    # Content-hashed Vite assets — cache aggressively.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must always revalidate: a cached copy pins the browser to a
    # bundle whose hashed assets disappear on the next deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # API + auth: reverse-proxy to the Hono service (the /api prefix is
    # preserved, which is what the app mounts its routes under).
    #
    # X-Forwarded-For is set by the edge Caddy (which discards client-supplied
    # values via trusted_proxies), so its first hop is the real client IP.
    location /api/ {
        # Variable upstream → per-request DNS resolution (see resolver above).
        # No URI part on the upstream, so the request URI passes through
        # unchanged (/api prefix preserved), same as a literal proxy_pass.
        set $api_upstream http://api:3001;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA fallback — client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
